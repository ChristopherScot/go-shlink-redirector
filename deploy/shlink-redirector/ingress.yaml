apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-redirector
  namespace: shlink
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: external
  tls:
    - hosts: [go.home.chrisscotmartin.com]
      secretName: shlink-redirector-tls
  rules:
    - host: go.home.chrisscotmartin.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-redirector
                port:
                  number: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shlink-redirector-lan
  namespace: shlink
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: external
  rules:
    - host: go
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: shlink-redirector
                port:
                  number: 80
